---
name: Push GitOps manifests
description: >-
  Download the manifests render-gitops uploaded in this workflow run and
  commit them to a GitOps branch in a single commit. Each top-level directory
  in the artifacts replaces the same directory on the branch; directories no
  artifact carries are left as they are. The source branch is never modified.
  Requires the repository to be checked out with credentials that can push
  (contents:write).

inputs:
  artifact-pattern:
    description: Glob matching the render-gitops artifacts to publish (e.g. gitops-dev-*).
    required: true
  branch:
    description: Branch to push the rendered manifests to.
    required: true
  message:
    description: Extra commit message paragraph, e.g. the release being deployed.
    default: ""

runs:
  using: composite
  steps:
    - name: Download rendered manifests
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ inputs.artifact-pattern }}
        path: ${{ runner.temp }}/gitops-rendered
        merge-multiple: true

    - name: Push manifests
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        MESSAGE: ${{ inputs.message }}
      run: |
        rendered="${RUNNER_TEMP}/gitops-rendered"
        mapfile -t targets < <(find "${rendered}" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort)
        if [ "${#targets[@]}" -eq 0 ]; then
          echo "::warning::No rendered manifests to publish"
          exit 0
        fi
        echo "Publishing: ${targets[*]}"

        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        worktree="${RUNNER_TEMP}/gitops-worktree"
        rm -rf "${worktree}"
        if git fetch --depth=1 origin "${BRANCH}"; then
          git worktree add -B "${BRANCH}" "${worktree}" FETCH_HEAD
        else
          # First run: start the branch with no history shared with the source branch.
          git worktree add --detach "${worktree}"
          git -C "${worktree}" checkout --orphan "${BRANCH}"
          git -C "${worktree}" rm -rqf --ignore-unmatch .
        fi

        # Replace each target directory entirely so deleted manifests don't linger.
        for target in "${targets[@]}"; do
          git -C "${worktree}" rm -rqf --ignore-unmatch -- "${target}"
          mkdir -p "${worktree}/${target}"
          cp -r "${rendered}/${target}/." "${worktree}/${target}/"
        done
        git -C "${worktree}" add -A

        if git -C "${worktree}" diff --cached --quiet; then
          echo "No manifest changes to push"
        else
          git -C "${worktree}" commit \
            -m "deploy: ${targets[*]} @ ${GITHUB_SHA::7}" \
            ${MESSAGE:+-m "${MESSAGE}"} \
            -m "Source commit: ${GITHUB_SHA}"

          # Runs that touch the same projects are serialized by the calling
          # workflow, so a rejected push means a run for *other* projects landed
          # first (e.g. two prod releases published together). Every run writes
          # only its own directories, so replay our commit on top and retry.
          attempts=5
          for attempt in $(seq 1 "${attempts}"); do
            if git -C "${worktree}" push origin "HEAD:refs/heads/${BRANCH}"; then
              break
            fi
            if [ "${attempt}" -eq "${attempts}" ]; then
              echo "::error::Push to ${BRANCH} was rejected ${attempts} times"
              exit 1
            fi
            echo "::warning::Push to ${BRANCH} rejected, replaying onto its new tip (attempt ${attempt}/${attempts})"
            git -C "${worktree}" fetch --depth=1 origin "${BRANCH}"
            # The fetch is shallow, so there is no merge base to find: replay
            # exactly the one commit made above.
            git -C "${worktree}" rebase --onto FETCH_HEAD HEAD~1
          done
        fi
        git worktree remove --force "${worktree}"
