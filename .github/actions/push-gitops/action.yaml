---
name: Push GitOps manifests
description: >-
  Copy a project's kustomize base and one overlay, substitute placeholder
  tokens in the manifests, and commit the result to a GitOps branch.
  The source branch is never modified. Requires the repository to be checked out with
  credentials that can push (contents:write).

inputs:
  gitops-dir:
    description: Directory containing base/ and overlays/, relative to the repository root.
    required: true
  overlay:
    description: Overlay to publish (e.g. dev).
    required: true
  replacements:
    description: >-
      Placeholder substitutions, one `<placeholder>=<value>` per line. Every
      placeholder must appear in at least one manifest, and none may survive
      into the rendered output. Leave empty to publish the manifests unchanged.
    default: ""
  branch:
    description: Branch to push the rendered manifests to.
    required: true
  target-path:
    description: >-
      Directory on the GitOps branch to write into (e.g. the project name).
      Only this directory is replaced, so each project sharing a branch must
      use its own.
    required: true

runs:
  using: composite
  steps:
    - name: Render manifests
      shell: bash
      env:
        GITOPS_DIR: ${{ inputs.gitops-dir }}
        OVERLAY: ${{ inputs.overlay }}
        REPLACEMENTS: ${{ inputs.replacements }}
      run: |
        out="${RUNNER_TEMP}/gitops-rendered"
        rm -rf "${out}"
        mkdir -p "${out}/overlays"
        cp -r "${GITOPS_DIR}/base" "${out}/base"
        cp -r "${GITOPS_DIR}/overlays/${OVERLAY}" "${out}/overlays/${OVERLAY}"

        while IFS= read -r line; do
          [ -n "${line}" ] || continue

          placeholder="${line%%=*}"
          value="${line#*=}"
          if [ "${placeholder}" = "${line}" ] || [ -z "${placeholder}" ]; then
            echo "::error::Replacement '${line}' is not in <placeholder>=<value> form"
            exit 1
          fi

          # A placeholder that matches nothing means a typo or a renamed token;
          # publishing unsubstituted manifests would only surface as a pull error.
          if ! grep -rqF -- "${placeholder}" "${out}"; then
            echo "::error::Placeholder ${placeholder} appears in no manifest"
            exit 1
          fi

          # `|` as the delimiter: image references contain `/`.
          find "${out}" -type f -name '*.yaml' \
            -exec sed -i "s|${placeholder}|${value}|g" {} +
        done <<< "${REPLACEMENTS}"

        # Catch anything the substitution missed, including placeholders that
        # only ever existed in a manifest the overlay does not include.
        manifests="$(kustomize build "${out}/overlays/${OVERLAY}")"
        while IFS= read -r line; do
          [ -n "${line}" ] || continue
          placeholder="${line%%=*}"
          if grep -qF -- "${placeholder}" <<< "${manifests}"; then
            echo "::error::Placeholder ${placeholder} survived into the rendered manifests"
            exit 1
          fi
        done <<< "${REPLACEMENTS}"

    - name: Push manifests
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        TARGET_PATH: ${{ inputs.target-path }}
        REPLACEMENTS: ${{ inputs.replacements }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

        worktree="${RUNNER_TEMP}/gitops-worktree"
        rm -rf "${worktree}"
        if git fetch --depth=1 origin "${BRANCH}"; then
          git worktree add -B "${BRANCH}" "${worktree}" FETCH_HEAD
        else
          # First run: start the branch with no history shared with the source branch.
          git worktree add --detach "${worktree}"
          git -C "${worktree}" checkout --orphan "${BRANCH}"
          git -C "${worktree}" rm -rqf --ignore-unmatch .
        fi

        # Replace the target directory entirely so deleted manifests don't linger.
        git -C "${worktree}" rm -rqf --ignore-unmatch -- "${TARGET_PATH}"
        mkdir -p "${worktree}/${TARGET_PATH}"
        cp -r "${RUNNER_TEMP}/gitops-rendered/." "${worktree}/${TARGET_PATH}/"
        git -C "${worktree}" add -A

        if git -C "${worktree}" diff --cached --quiet; then
          echo "No manifest changes to push"
        else
          git -C "${worktree}" commit -m "deploy: ${TARGET_PATH}@${GITHUB_SHA::7}" \
            -m "${REPLACEMENTS}" -m "Source commit: ${GITHUB_SHA}"
          git -C "${worktree}" push origin "HEAD:refs/heads/${BRANCH}"
        fi
        git worktree remove --force "${worktree}"
