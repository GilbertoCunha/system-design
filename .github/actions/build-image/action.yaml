---
name: Build image
description: >-
  Build a Docker image and push it to GHCR as
  ghcr.io/<owner>/<repo>:<name>-<git-sha>.

inputs:
  name:
    description: Image name, used as the image tag prefix and build cache scope.
    required: true
  context:
    description: Docker build context, relative to the repository root.
    required: true
  dockerfile:
    description: Dockerfile to build, relative to the build context.
    default: Dockerfile
  token:
    description: Token with packages:write permission.
    required: true

outputs:
  image:
    description: Full image reference that was pushed.
    value: ${{ steps.image.outputs.ref }}

runs:
  using: composite
  steps:
    # GHCR requires lowercase repository names, but the owner may contain uppercase.
    - name: Compute image reference
      id: image
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: |
        repository="${GITHUB_REPOSITORY,,}"
        echo "ref=ghcr.io/${repository}:${NAME}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Build and push image
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.image.outputs.ref }}
        cache-from: type=gha,scope=${{ inputs.name }}
        cache-to: type=gha,mode=max,scope=${{ inputs.name }}
