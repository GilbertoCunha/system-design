---
name: Parse release
description: >-
  Split a <project>-vX.Y.Z release tag into its project and version, and fail
  unless the project is known and the release commit is on main. Requires a
  checkout with main's history (fetch-depth: 0).

inputs:
  tag:
    description: Release tag, e.g. url-shortener-v1.2.3.
    required: true
  projects:
    description: Space-separated projects that can be released.
    required: true

outputs:
  project:
    description: Project folder, e.g. url-shortener.
    value: ${{ steps.parse.outputs.project }}
  version:
    description: Release version, e.g. v1.2.3.
    value: ${{ steps.parse.outputs.version }}

runs:
  using: composite
  steps:
    - name: Parse tag
      id: parse
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        PROJECTS: ${{ inputs.projects }}
      run: |
        if [[ ! "${TAG}" =~ ^([a-z0-9-]+)-(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          echo "::error::Release tag '${TAG}' is not <project>-vX.Y.Z"
          exit 1
        fi
        project="${BASH_REMATCH[1]}"
        version="${BASH_REMATCH[2]}"
        if [[ " ${PROJECTS} " != *" ${project} "* ]]; then
          echo "::error::'${project}' is not a releasable project (known: ${PROJECTS})"
          exit 1
        fi
        echo "project=${project}" >> "$GITHUB_OUTPUT"
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Check the release commit is on main
      shell: bash
      run: |
        if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
          echo "::error::${GITHUB_SHA} is not on main"
          exit 1
        fi
