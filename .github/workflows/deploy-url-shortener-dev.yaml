---
name: deploy-url-shortener-dev

on:
  push:
    branches:
      - main
    paths:
      - .github/actions/**
      - .github/workflows/deploy-url-shortener-dev.yaml
      - url-shortener/**

# Serialize pushes to the gitops/dev branch across runs.
concurrency:
  group: gitops-dev
  cancel-in-progress: false

permissions:
  contents: write # push to the gitops/dev branch
  packages: write # push to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: url-shortener-backend
            context: url-shortener
            dockerfile: Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        uses: ./.github/actions/build-image
        with:
          name: ${{ matrix.name }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Matrix jobs can't expose one output per leg, so rebuild the references
      # the same way the build-image action does.
      - name: Compute image registry
        id: registry
        shell: bash
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Push manifests to gitops/dev
        uses: ./.github/actions/push-gitops
        with:
          gitops-dir: url-shortener/gitops
          overlay: dev
          images: |
            url-shortener-backend=${{ steps.registry.outputs.repository }}:url-shortener-backend-${{ github.sha }}
          branch: gitops/dev
          target-path: url-shortener
