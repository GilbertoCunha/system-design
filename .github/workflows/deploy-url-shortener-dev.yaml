---
name: deploy-url-shortener-dev

on:
  push:
    branches:
      - main
    paths:
      - .github/actions/**
      - .github/workflows/deploy-url-shortener-dev.yaml
      - url-shortener/**

# Serialize pushes to the gitops/dev branch across runs.
concurrency:
  group: gitops-dev
  cancel-in-progress: false

permissions:
  contents: write # push to the gitops/dev branch
  packages: write # push to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: url-shortener-backend
            context: url-shortener
            dockerfile: Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        uses: ./.github/actions/build-image
        with:
          name: ${{ matrix.name }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Push manifests to gitops/dev
        uses: ./.github/actions/push-gitops
        with:
          gitops-dir: url-shortener/gitops
          overlay: dev
          # The manifests carry the registry and repository; only the tag and
          # the migration Job's name suffix vary, and both are the commit SHA,
          # so one substitution keeps them consistent by construction.
          replacements: git-sha-placeholder=${{ github.sha }}
          branch: gitops/dev
          target-path: url-shortener
