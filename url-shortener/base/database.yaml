---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: url-shortener-db
  labels:
    grncunha.com/project: url-shortener
    grncunha.com/service: db
  annotations:
    # Database is the first resource to be created
    argocd.argoproj.io/sync-wave: "-2"
spec:
  inheritedMetadata:
    # Only labels under our own prefix. CNPG sets unprefixed ones itself (a
    # legacy `role: primary` on the instance pod and PVC), and a plain `role`
    # here once had the operator and inheritedMetadata overwriting each other
    # on every reconcile: ~5 reconciles a second, each polling the instance
    # status over fresh connections, which kept Postgres at 60% of its CPU
    # limit while idle.
    labels:
      grncunha.com/project: url-shortener
      grncunha.com/service: db
    annotations:
      # Monitoring
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: /metrics
      # See api.yaml. CNPG copies these onto its Services as well, but only
      # the pod scrape honours the interval.
      prometheus.io/interval: 5s

  instances: 1

  # CNPG guards the primary with a PodDisruptionBudget that allows no
  # disruptions. With one instance there is no replica to move to, so the
  # budget can never be met and every node drain fails on this pod: a Talos
  # upgrade stops at "error when evicting pods". Without it the pod is evicted
  # like any other and comes back when the node does.
  enablePDB: false

  # How long a shutdown waits for clients to disconnect before it closes
  # their connections. The API holds a pool open and never disconnects, so the
  # default of 180 was three minutes of waiting on every restart.
  smartShutdownTimeout: 15

  postgresql:
    parameters:
      synchronous_commit: "off"
      shared_buffers: "250MB"
      # Times every read and write of a data file, so pg_stat_database's
      # blk_read_time and blk_write_time (the dashboard's disk time) aren't 0.
      track_io_timing: "on"

  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      cpu: 2
      memory: 1Gi

  storage:
    size: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener-db-lb
  labels:
    grncunha.com/project: url-shortener
    grncunha.com/service: db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster

  selector:
    cnpg.io/cluster: url-shortener-db
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-db-clients
  labels:
    grncunha.com/project: url-shortener
    grncunha.com/service: db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: url-shortener-db
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
