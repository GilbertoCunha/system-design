---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrations
  annotations:
    # A Sync hook: ArgoCD deletes the previous Job and creates this one on every
    # sync. Job specs are immutable, so a plain resource would fail to update
    # when its image changes.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Between the database (-2) and the backend (0). The sync only moves past
    # this wave once the Job succeeds, so the backend is never rolled out
    # against an unmigrated schema.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        grncunha.com/project: url-shortener
        grncunha.com/service: migrations
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: goose
          # Pinned to the commit's image by the deploy workflow.
          image: url-shortener
          # Prevent privilege escalation
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/goose
            - -dir
            - /migrations
            - postgres
            - up
          env:
            - name: GOOSE_DBSTRING
              valueFrom:
                secretKeyRef:
                  name: url-shortener-db-app
                  key: uri
          resources:
            requests:
              cpu: 100m
              memory: 50Mi
            limits:
              cpu: 200m
              memory: 100Mi
