---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-cache
  labels:
    app: url-shortener
    role: cache
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: url-shortener
      role: cache
  template:
    metadata:
      labels:
        app: url-shortener
        role: cache
      annotations:
        # Metrics scraping
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          emptyDir: {}
      containers:
        - name: redis
          image: redis:8.10
          # Keys are written without a TTL, so without a cap Redis grows until
          # the container is OOM-killed at its limit. Capped at 75% of the
          # limit, leaving room for Redis' own overhead and fragmentation, it
          # evicts the least recently used keys instead: a miss is only a
          # slower Postgres lookup, a kill empties the whole cache.
          args:
            - redis-server
            - --maxmemory
            - 768mb
            - --maxmemory-policy
            - allkeys-lru
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 500Mi
            limits:
              cpu: 500m
              memory: 1Gi
          ports:
            - containerPort: 6379

        # Metrics exporter for redis
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.92.0
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          ports:
            - name: metrics
              containerPort: 9121
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener-cache
  labels:
    app: url-shortener
    role: cache
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  type: ClusterIP
  selector:
    app: url-shortener
    role: cache
  ports:
    - name: redis
      port: 6379
      protocol: TCP
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener-cache-lb
  labels:
    app: url-shortener
    role: cache
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster

  selector:
    app: url-shortener
    role: cache
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cache-clients
  labels:
    app: url-shortener
    role: db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      app: url-shortener
      role: cache
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
