---
services:
  api:
    build: .
    ports:
      - "8080:8080"

  database:
    image: postgres:18.6
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: url_shortener
      POSTGRES_PASSWORD: 1234567890
    ports:
      - "5432:5432"

  cache:
    image: redis:8.10
    command: redis-server --requirepass 1234567890
    ports:
      - "6379:6379"

  redis-insights:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - cache
