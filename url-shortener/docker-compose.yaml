---
services:
  api:
    build: .
    command:
      - /bin/url_shortener
      - --environment
      - local
    ports:
      - "8080:8080"
    environment:
      POSTGRES_URI: postgresql://url_shortener:1234567890@database:5432/url_shortener
      REDIS_URI: redis://cache:6379
    depends_on:
      cache:
        condition: service_started
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  database:
    image: postgres:18.6
    # Used to optimize postgres to reply before flushing
    # WAL to the filesystem on every commit. Instead, WAL
    # is flushed after the reply in the background.
    # Trade-off is that we might lose the last ~200ms of commits
    # if the server dies, which is fine for our use-case
    command:
      - postgres
      - -c
      - synchronous_commit=off
      - -c
      - shared_buffers=1GB
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: url_shortener
      POSTGRES_PASSWORD: 1234567890
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - "5432:5432"

  migrations:
    build: .
    command:
      - /bin/goose
      - -dir
      - /migrations
      - postgres
      - up
    environment:
      GOOSE_DBSTRING: postgresql://url_shortener:1234567890@database:5432/url_shortener
    depends_on:
      database:
        condition: service_healthy

  cache:
    image: redis:8.10
    ports:
      - "6379:6379"

  redis-insights:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - cache
