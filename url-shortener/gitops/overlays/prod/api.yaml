---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-api
spec:
  template:
    spec:
      containers:
        - name: api
          # Pinned to the commit's image by the deploy workflow.
          image: url-shortener
          command:
            - /bin/url_shortener
            - --environment
            - prod
          # Prevent privilege escalation
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # Go never picks fewer than 2 threads on its own, and 2 threads
            # can spend a 500m quota in half of each 100ms period, then get
            # paused for the rest. Taken from the limit (rounded up to whole
            # CPUs), so it follows any change to it.
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  containerName: api
                  resource: limits.cpu
                  divisor: "1"
            # The memory limit in bytes, which the server turns into Go's
            # own memory limit (GOMEMLIMIT). See setMemoryLimit in
            # cmd/server/main.go.
            - name: MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: api
                  resource: limits.memory
                  divisor: "1"
            - name: REDIS_URI
              value: redis://url-shortener-cache:6379
            - name: POSTGRES_URI
              valueFrom:
                secretKeyRef:
                  name: url-shortener-db-app
                  key: uri
          # Define expected resources for the pods
          resources:
            requests:
              cpu: 1
              memory: 100Mi
            limits:
              cpu: 3
              memory: 500Mi
          # Define readiness and liveness conditions
          # using probes
          readinessProbe:
            initialDelaySeconds: 2
            periodSeconds: 5
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            periodSeconds: 10
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: url-shortener
spec:
  parentRefs:
    - name: gw-public
      namespace: gateway-system
      sectionName: http
  hostnames:
    - url-shortener.grncunha.com
