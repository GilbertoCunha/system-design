---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-backend
spec:
  template:
    spec:
      containers:
        - name: url-shortener
          command:
            - /bin/url_shortener
            - --environment
            - prod
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: url-shortener
spec:
  parentRefs:
    - name: gw-public
      namespace: gateway-system
      sectionName: http
  hostnames:
    - url-shortener.grncunha.com
