---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-api
  labels:
    grncunha.com/project: url-shortener
    grncunha.com/service: api
spec:
  replicas: 1
  selector:
    matchLabels:
      grncunha.com/project: url-shortener
      grncunha.com/service: api
  template:
    metadata:
      labels:
        grncunha.com/project: url-shortener
        grncunha.com/service: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
        # 5s instead of the cluster's 15s: the dashboard's rate windows
        # shrink from 1m to 20s, so its graphs lag ~10s instead of ~30s.
        prometheus.io/interval: 5s
        # Continuous profiling: Pyroscope's Alloy pulls these from the pod's
        # pprof port (app.pprof_addr in config/). Not on the Service, so the
        # gateway never reaches it. Block and mutex are left out: Go only
        # records them once the app sets a sampling rate, which it doesn't.
        profiles.grafana.com/cpu.scrape: "true"
        profiles.grafana.com/cpu.port: "6060"
        profiles.grafana.com/memory.scrape: "true"
        profiles.grafana.com/memory.port: "6060"
        profiles.grafana.com/goroutine.scrape: "true"
        profiles.grafana.com/goroutine.port: "6060"
    spec:
      topologySpreadConstraints:
        - topologyKey: kubernetes.io/hostname
          maxSkew: 1
          whenUnsatisfiable: DoNotSchedule
          # Count only the nodes this pod can run on. By default taints are
          # ignored here, so the tainted control plane and system nodes count
          # as empty nodes, and a rollout's new pod on the worker breaks the
          # skew against them: it stays Pending forever.
          nodeTaintsPolicy: Honor
          # Which pods count towards the spread. Without it the constraint
          # matches no pods and spreads nothing.
          labelSelector:
            matchLabels:
              grncunha.com/project: url-shortener
              grncunha.com/service: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener-api
  labels:
    grncunha.com/project: url-shortener
    grncunha.com/service: api
spec:
  type: ClusterIP
  selector:
    grncunha.com/project: url-shortener
    grncunha.com/service: api
  ports:
    - name: 8080-8080
      port: 8080
      protocol: TCP
      targetPort: 8080
      # Communicate over unencrypted HTTP2
      # for http connection sharing
      appProtocol: kubernetes.io/h2c
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: url-shortener
  labels:
    grncunha.com/project: url-shortener
spec:
  parentRefs:
    - name: gw-internal-dev
      namespace: gateway-system
      sectionName: https
    - name: gw-internal-dev
      namespace: gateway-system
      sectionName: http
  hostnames:
    - url-shortener.dev.k8s.homelab.grncunha.com
  rules:
    - backendRefs:
        - name: url-shortener-api
          port: 8080
---
# Increase kgateway envoy request limits
# for the API. Default is 1024 requests in
# flight
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: url-shortener-api
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: url-shortener-api
  circuitBreakers:
    maxRequests: 10000
    maxPendingRequests: 10000
    trackRemaining: true
---
# The API on its own address on the mesh, without the gateway in front: Envoy
# took ~2 CPUs at 10k requests a second, and without it the same box served
# ~18k (the benchmarks in the blog series). Plain HTTP, as the mesh already
# encrypts traffic with WireGuard. The gateway's HTTPRoute above stays, for
# HTTPS by name.
apiVersion: v1
kind: Service
metadata:
  name: url-shortener-api-lb
  labels:
    grncunha.com/project: url-shortener
    grncunha.com/service: api
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  # Announced only from the node running the API, so traffic arrives there
  # without a hop between VMs
  externalTrafficPolicy: Local
  selector:
    grncunha.com/project: url-shortener
    grncunha.com/service: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-api-clients
  labels:
    grncunha.com/project: url-shortener
    grncunha.com/service: api
spec:
  endpointSelector:
    matchLabels:
      grncunha.com/project: url-shortener
      grncunha.com/service: api
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
