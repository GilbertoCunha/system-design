---
apiVersion: batch/v1
kind: Job
metadata:
  name: url-shortener-db-migrations
  annotations:
    # Job should be created after database
    # and re-created in every sync since job
    # specs are immutable
    # A job only reports as healthy after it succeeds
    # so the next wave (backend deployment)
    # only happens after the migrations are in place
    argocd.argoproj.io/sync-options: "Replace=true,Force=true"
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: url-shortener
        role: migrations
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: goose
          image: url-shortener-backend
          # Prevent privilege escalation
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/goose
            - -dir
            - /migrations
            - postgres
            - up
          env:
            - name: GOOSE_DBSTRING
              valueFrom:
                secretKeyRef:
                  name: url-shortener-db-app
                  key: uri
          resources:
            requests:
              cpu: 200m
              memory: 100Mi
            limits:
              cpu: 500m
              memory: 200Mi
