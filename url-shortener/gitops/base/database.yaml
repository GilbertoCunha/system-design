---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: url-shortener-db
  labels:
    grncunha.com/project: url-shortener
    grncunha.com/service: db
  annotations:
    # Database is the first resource to be created
    argocd.argoproj.io/sync-wave: "-2"
spec:
  inheritedMetadata:
    # Only labels under our own prefix. CNPG sets unprefixed ones itself (a
    # legacy `role: primary` on the instance pod and PVC), and a plain `role`
    # here once had the operator and inheritedMetadata overwriting each other
    # on every reconcile: ~5 reconciles a second, each polling the instance
    # status over fresh connections, which kept Postgres at 60% of its CPU
    # limit while idle.
    labels:
      grncunha.com/project: url-shortener
      grncunha.com/service: db
    annotations:
      # Monitoring
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: /metrics

  instances: 1

  resources:
    requests:
      cpu: 200m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 500Mi

  storage:
    size: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener-db-lb
  labels:
    grncunha.com/project: url-shortener
    grncunha.com/service: db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster

  selector:
    cnpg.io/cluster: url-shortener-db
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-db-clients
  labels:
    grncunha.com/project: url-shortener
    grncunha.com/service: db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: url-shortener-db
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
