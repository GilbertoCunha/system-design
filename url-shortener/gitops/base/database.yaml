---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: url-shortener-db
  labels:
    app: url-shortener
    role: db
  annotations:
    # Database is the first resource to be created
    argocd.argoproj.io/sync-wave: "-2"
spec:
  instances: 1

  resources:
    requests:
      cpu: 200m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 500Mi

  storage:
    size: 10Gi

  monitoring:
    enablePodMonitor: true
