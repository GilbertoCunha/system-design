---
app:
  log_level: debug
  port: 8080
  read_header_timeout: 2s
  read_timeout: 5s
  write_timeout: 5s
  idle_timeout: 30s
  max_in_flight: 2000
  pprof_addr: ":6060"
  # HTTPS, served only when TLS_CERT_FILE and TLS_KEY_FILE are set
  tls:
    port: 8443

postgres:
  timeouts:
    acquire: 500ms
    query: 2s
  # Per API pod. 20 served 10k req/s cleanly at 10 reads per write
  # (2026-10-03): most reads are answered by Redis, so few reach Postgres.
  pool:
    min_conns: 5
    max_conns: 20

redis:
  timeouts:
    query: 500ms
  # Per API pod. 50 served the same 10k req/s.
  pool:
    size: 150
