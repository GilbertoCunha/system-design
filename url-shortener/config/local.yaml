---
app:
  log_level: debug
  port: 8080
  read_header_timeout: 2s
  read_timeout: 5s
  write_timeout: 5s
  idle_timeout: 30s
  max_in_flight: 800
  pprof_addr: ":6060"
  # HTTPS, served only when TLS_CERT_FILE and TLS_KEY_FILE are set
  tls:
    port: 8443

postgres:
  timeouts:
    acquire: 500ms
    query: 2s
  pool:
    min_conns: 5
    max_conns: 20

redis:
  timeouts:
    query: 500ms
  pool:
    size: 20
