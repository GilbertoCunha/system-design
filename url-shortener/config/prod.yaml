---
app:
  log_level: warn
  port: 8080
  read_header_timeout: 2s
  read_timeout: 5s
  write_timeout: 5s
  idle_timeout: 30s
  max_in_flight: 1200
  pprof_addr: ":6060"

postgres:
  timeouts:
    acquire: 500ms
    query: 2s
  # Per API pod. Postgres allows 100 connections (a few reserved)
  pool:
    min_conns: 90
    max_conns: 90

redis:
  timeouts:
    query: 500ms
  # Per API pod
  pool:
    size: 600
