---
version: "3"

env:
  PG_DSN: postgresql://url_shortener:1234567890@localhost:5432/url_shortener

tasks:
  ###########
  # Secrets #
  ###########

  secrets:load:*:
    env:
      ENV: "{{index .MATCH 0}}"
    cmds:
      - echo $ENV

  ###################
  # Docker commands #
  ###################

  docker:up:
    cmds:
      - docker compose up --build -d

  docker:down:
    cmds:
      - docker compose down

  ##############
  # Migrations #
  ##############

  migrations:new:
    cmds:
      - |
        goose postgres $PG_DSN \
        create migrate sql --dir internal/database/migrations

  ##########
  # Checks #
  ##########

  go:check:
    cmds:
      - go build ./...
      - go vet ./...

  ########
  # Sqlc #
  ########

  sqlc:generate:
    cmds:
      - sqlc generate

  #########
  # Tests #
  #########

  test:e2e:local:
    deps:
      - task: docker:up
    cmds:
      - go clean -testcache
      - go test ./test/e2e/...

  test:load:*:local:
    deps:
      - task: docker:up
    env:
      FILE: "{{index .MATCH 0}}"
    cmds:
      - k6 run test/load/$FILE.js

  # Also reports the run to VictoriaMetrics (k6's metrics, tagged with the
  # environment's namespace and a test id), which the dashboard's "Load tests"
  # annotation marks each run with. Local runs report nowhere.
  test:load:*:dev:
    env:
      FILE: "{{index .MATCH 0}}"
    cmds:
      - |
        K6_PROMETHEUS_RW_SERVER_URL=https://victoria-metrics.k8s.homelab.grncunha.com/api/v1/write \
        K6_PROMETHEUS_RW_TREND_STATS="p(50),p(90),p(99),max" \
        BASE_URL=https://url-shortener.dev.k8s.homelab.grncunha.com \
        k6 run -o experimental-prometheus-rw \
          --tag namespace=project-url-shortener-dev \
          --tag testid=$FILE-$(date -u +%Y%m%dT%H%M%SZ) \
          test/load/$FILE.js
