---
# The API on its own address on the mesh, without the gateway in front: Envoy
# took ~2 CPUs at 10k requests a second, and without it the same box served
# ~18k (the benchmarks in the blog series). Plain HTTP, as the mesh already
# encrypts traffic with WireGuard. The gateway's HTTPRoute (in base) stays, for
# HTTPS by name. Dev only for now.
apiVersion: v1
kind: Service
metadata:
  name: url-shortener-api-lb
  annotations:
    external-dns.kubernetes.io/hostname: url-shortener-l3.dev.k8s.homelab.grncunha.com
  labels:
    grncunha.com/project: url-shortener
    grncunha.com/service: api
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  # Announced only from the node running the API, so traffic arrives there
  # without a hop between VMs
  externalTrafficPolicy: Local
  selector:
    grncunha.com/project: url-shortener
    grncunha.com/service: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-api-clients
  labels:
    grncunha.com/project: url-shortener
    grncunha.com/service: api
spec:
  endpointSelector:
    matchLabels:
      grncunha.com/project: url-shortener
      grncunha.com/service: api
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
